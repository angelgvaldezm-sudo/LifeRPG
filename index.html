<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Life RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-neutral-100 text-neutral-900 antialiased selection:bg-orange-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICONOS SIMULADOS PARA NAVEGADOR ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        Flame: '🔥', Coins: '🪙', Heart: '❤️', Sparkles: '✨', Trophy: '🏆',
        CheckCircle2: '✓', Camera: '📷', ImageIcon: '🖼️', Crosshair: '🎯',
        User: '👤', Compass: '🧭', ShoppingBag: '🛍️', History: '📜', Plus: '➕',
        X: '❌', Volume2: '🔊', VolumeX: '🔇', Swords: '⚔️', Loader2: '⏳',
        Edit3: '✏️', Trash2: '🗑️', RotateCcw: '🔄', Check: '✓', ShieldAlert: '⚠️',
        Wand2: '🪄', Cloud: '☁️', LogOut: '🚪', UserPlus: '👤+', LogIn: '🔑', Globe: '🌐'
      };
      return <span className={className}>{icons[name] || '📍'}</span>;
    };

    const roundToNearest10 = (num) => Math.round(num / 10) * 10;

    const thresholdForLevel = (level) => {
      if (level <= 1) return 0;
      return roundToNearest10(205 * Math.pow(level - 1, 1.77));
    };

    const calculateLevelState = (lifetimeXP) => {
      let level = 1;
      while (thresholdForLevel(level + 1) <= lifetimeXP) {
        level++;
      }
      const currentThreshold = thresholdForLevel(level);
      const nextThreshold = thresholdForLevel(level + 1);
      const xpIntoCurrentLevel = lifetimeXP - currentThreshold;
      const xpNeededForNextLevel = nextThreshold - currentThreshold;
      const progress = Math.min(Math.max(xpIntoCurrentLevel / (xpNeededForNextLevel || 1), 0), 1);

      return { level, xpIntoCurrentLevel, xpNeededForNextLevel, progress, lifetimeXP };
    };

    function pcmToWav(pcm16, sampleRate) {
      const buffer = new ArrayBuffer(44 + pcm16.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + pcm16.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, pcm16.length * 2, true);
      for (let i = 0; i < pcm16.length; i++) {
        view.setInt16(44 + i * 2, pcm16[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    const getTodayDateStr = () => new Date().toISOString().split('T')[0];

    const getRecentWeekDays = () => {
      const days = [];
      const today = new Date();
      for (let i = -3; i <= 3; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = d.toLocaleDateString('es-ES', { weekday: 'short' });
        const dayNum = d.getDate();
        days.push({
          dateStr,
          dayName: dayName.charAt(0).toUpperCase() + dayName.slice(1, 3),
          dayNum: dayNum.toString(),
          isToday: i === 0
        });
      }
      return days;
    };

    const INITIAL_STATE = {
      onboardingCompleted: true,
      user: {
        id: 'user-player-1',
        name: 'Ángel',
        avatar: '🎯',
        customAvatarUrl: null,
        joinDate: new Date().toLocaleDateString('es-ES', { month: 'short', year: 'numeric' }),
        maxHP: 100,
        currentHP: 100,
        recoveryMode: false,
        selectedGoals: ['Salud', 'Mente', 'Productividad']
      },
      xpLedger: [],
      coinsLedger: [],
      skillsLedger: { Fitness: 0, Conocimiento: 0, Creatividad: 0, Aventura: 0, Social: 0, Finanzas: 0 },
      habits: [
        { id: 'h-1', name: 'Ejercicio o Estiramiento 20m', icon: '🏋️', category: 'Fitness', difficulty: 'Medium', xp: 25, coins: 12, proofRequired: true, streak: 0, linkedToBoss: true },
        { id: 'h-2', name: 'Leer 15 Páginas de un Libro', icon: '📖', category: 'Conocimiento', difficulty: 'Easy', xp: 10, coins: 5, proofRequired: true, streak: 0, linkedToBoss: false },
        { id: 'h-3', name: 'Tomar 2 Litros de Agua', icon: '💧', category: 'Fitness', difficulty: 'Easy', xp: 10, coins: 5, proofRequired: false, streak: 0, linkedToBoss: false }
      ],
      completionsByDate: {},
      enemies: [
        { id: 'e-1', name: 'Doomscrolling Nocturno', icon: '📱', avoidanceCue: 'Dejar el teléfono lejos a las 10 PM', damage: 10 },
        { id: 'e-2', name: 'Comida Chatarra sin Plan', icon: '🍔', avoidanceCue: 'Elegir fruta o snack nutritivo', damage: 15 }
      ],
      enemyReportsByDate: {},
      quests: [
        { id: 'q-1', title: 'Explorador Urbano', category: 'Aventura', description: 'Visita un café o parque nuevo en tu ciudad esta semana.', difficulty: 'Fácil', xp: 100, coins: 40, status: 'accepted' }
      ],
      boss: {
        id: 'boss-1', name: 'RETO FITNESS: 10 ENTRENAMIENTOS', category: 'Fitness', description: 'Completa 10 sesiones de entrenamiento para derrotar a este Jefe.',
        targetMetric: 10, currentMetric: 0, unit: 'sesiones', remainingHP: 100, xpReward: 1000, coinReward: 500, completed: false
      },
      gallery: [],
      shopItems: [
        { id: 'item-potion-small', name: 'Poción Pequeña de Salud', icon: '🧪', type: 'game', effect: '+10 HP', cost: 100, desc: 'Restaura 10 HP inmediatamente.', custom: false },
        { id: 'item-potion-big', name: 'Poción Mayor de Salud', icon: '⚗️', type: 'game', effect: '+25 HP', cost: 250, desc: 'Restaura 25 HP inmediatamente.', custom: false },
        { id: 'item-full-heal', name: 'Restauración Total', icon: '✨', type: 'game', effect: 'Restablece 100 HP', cost: 600, desc: 'Salud al máximo.', custom: false },
        { id: 'rw-coffee', name: 'Café de Especialidad', icon: '☕', type: 'real', effect: 'Premio Real', cost: 80, desc: 'Disfruta un postre o café sin culpa.', custom: false }
      ],
      achievements: [
        { id: 'ach-1', title: 'Primer Paso', icon: '🌱', desc: 'Verifica tu primer hábito real', unlocked: false },
        { id: 'ach-2', title: 'Constancia 3 Días', icon: '🔥', desc: 'Logra racha de 3 días', unlocked: false }
      ]
    };

    function App() {
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem('LIFE_RPG_USER_DATA_V15');
          return saved ? JSON.parse(saved) : INITIAL_STATE;
        } catch (e) {
          return INITIAL_STATE;
        }
      });

      const weekDays = useMemo(() => getRecentWeekDays(), []);
      const [selectedDate, setSelectedDate] = useState(getTodayDateStr());
      const [activeTab, setActiveTab] = useState('today');
      const [rewardModal, setRewardModal] = useState(null);
      const [activeModal, setActiveModal] = useState(null);
      const [selectedHabitForProof, setSelectedHabitForProof] = useState(null);
      const [capturedImagePreview, setCapturedImagePreview] = useState(null);

      const lifetimeXP = useMemo(() => data.xpLedger.reduce((sum, item) => sum + item.amount, 0), [data.xpLedger]);
      const coinBalance = useMemo(() => data.coinsLedger.reduce((sum, item) => sum + item.amount, 0), [data.coinsLedger]);
      const levelInfo = useMemo(() => calculateLevelState(lifetimeXP), [lifetimeXP]);

      const updateAppDataAndSync = (newDataOrUpdater) => {
        setData((prevData) => {
          const updatedData = typeof newDataOrUpdater === 'function' ? newDataOrUpdater(prevData) : newDataOrUpdater;
          try {
            localStorage.setItem('LIFE_RPG_USER_DATA_V15', JSON.stringify(updatedData));
          } catch (e) {}
          return updatedData;
        });
      };

      const handleVerifyHabit = () => {
        if (!selectedHabitForProof) return;

        const habit = selectedHabitForProof;
        const earnedXP = habit.xp;

        updateAppDataAndSync(prev => ({
          ...prev,
          xpLedger: [...prev.xpLedger, { id: `xp-${Date.now()}`, amount: earnedXP }],
          coinsLedger: [...prev.coinsLedger, { id: `c-${Date.now()}`, amount: habit.coins }],
          completionsByDate: {
            ...prev.completionsByDate,
            [selectedDate]: [...(prev.completionsByDate[selectedDate] || []), habit.id]
          }
        }));

        setSelectedHabitForProof(null);
        setActiveModal(null);
        setRewardModal({ title: '¡Hábito Completado!', subtitle: `Ganaste +${earnedXP} XP y +${habit.coins} Monedas.` });
      };

      const dateCompletionsList = data.completionsByDate[selectedDate] || [];

      return (
        <div className="flex justify-center items-center min-h-screen bg-neutral-200 font-sans text-neutral-900 select-none p-0 sm:p-4">
          <div className="relative w-full max-w-md h-screen sm:h-[860px] bg-[#f4f4f6] sm:rounded-[40px] overflow-hidden shadow-2xl flex flex-col border border-neutral-300">
            
            {/* Header Bar */}
            <header className="px-5 pt-4 pb-3 bg-[#f4f4f6]/90 backdrop-blur-md sticky top-0 z-30">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-2.5">
                  <div className="w-10 h-10 rounded-full bg-[#f94a29] flex items-center justify-center text-lg text-white shadow-md">
                    {data.user.avatar}
                  </div>
                  <div>
                    <span className="text-xs font-black text-neutral-900">{data.user.name}</span>
                    <p className="text-[10px] text-neutral-500 font-bold">Nivel {levelInfo.level}</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <div className="flex items-center gap-1 bg-white px-3 py-1.5 rounded-full border border-neutral-200 text-neutral-900 font-black text-xs shadow-sm">
                    <Icon name="Coins" className="text-amber-500" />
                    <span>{coinBalance}</span>
                  </div>
                </div>
              </div>

              {/* Level Progress */}
              <div className="mt-3.5 p-4 bg-white rounded-3xl border border-neutral-200/80 shadow-sm">
                <div className="flex justify-between items-center text-xs font-bold mb-1">
                  <span>Nivel {levelInfo.level}</span>
                  <span>{levelInfo.xpIntoCurrentLevel} / {levelInfo.xpNeededForNextLevel} XP</span>
                </div>
                <div className="w-full bg-neutral-100 h-2.5 rounded-full overflow-hidden">
                  <div className="bg-[#f94a29] h-full transition-all duration-500" style={{ width: `${levelInfo.progress * 100}%` }} />
                </div>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto px-5 py-3 space-y-4 pb-28">
              {activeTab === 'today' && (
                <div className="space-y-3">
                  <h2 className="text-xs font-extrabold uppercase tracking-wider text-neutral-400">Hábitos Diarios</h2>
                  {data.habits.map((habit) => {
                    const isDone = dateCompletionsList.includes(habit.id);
                    return (
                      <div key={habit.id} className="p-3.5 bg-white rounded-3xl border border-neutral-200/80 shadow-sm flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                          <span className="text-2xl">{habit.icon}</span>
                          <div>
                            <h3 className="text-sm font-bold text-neutral-900">{habit.name}</h3>
                            <p className="text-xs text-[#f94a29] font-bold">+{habit.xp} XP • +{habit.coins} Monedas</p>
                          </div>
                        </div>
                        {isDone ? (
                          <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full">Hecho</span>
                        ) : (
                          <button
                            onClick={() => { setSelectedHabitForProof(habit); setActiveModal('proof'); }}
                            className="bg-[#f94a29] text-white font-bold text-xs px-3.5 py-2 rounded-full shadow-md"
                          >
                            Verificar
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </main>

            {/* Bottom Dock */}
            <div className="absolute bottom-4 left-0 right-0 px-6 z-30">
              <nav className="bg-neutral-900 text-white rounded-full p-2 shadow-2xl flex items-center justify-around">
                <button onClick={() => setActiveTab('today')} className={`px-4 py-2 rounded-full text-xs font-bold ${activeTab === 'today' ? 'bg-white text-neutral-900' : 'text-neutral-400'}`}>Hoy</button>
                <button onClick={() => setActiveTab('quests')} className={`px-4 py-2 rounded-full text-xs font-bold ${activeTab === 'quests' ? 'bg-white text-neutral-900' : 'text-neutral-400'}`}>Misiones</button>
                <button onClick={() => setActiveTab('boss')} className={`px-4 py-2 rounded-full text-xs font-bold ${activeTab === 'boss' ? 'bg-white text-neutral-900' : 'text-neutral-400'}`}>Jefe</button>
              </nav>
            </div>

            {/* Modal Proof */}
            {activeModal === 'proof' && selectedHabitForProof && (
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-white rounded-3xl p-5 space-y-4 shadow-2xl">
                  <h3 className="text-sm font-bold text-neutral-900">Verificar Hábito: {selectedHabitForProof.name}</h3>
                  <button onClick={handleVerifyHabit} className="w-full py-3 bg-neutral-900 text-white font-bold rounded-2xl text-xs">
                    Completar e Ingresar
                  </button>
                </div>
              </div>
            )}

            {/* Reward Popup */}
            {rewardModal && (
              <div className="absolute inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-5">
                <div className="w-full max-w-xs bg-white rounded-3xl p-6 text-center space-y-3 shadow-2xl">
                  <h3 className="text-base font-black text-neutral-900">{rewardModal.title}</h3>
                  <p className="text-xs text-neutral-600">{rewardModal.subtitle}</p>
                  <button onClick={() => setRewardModal(null)} className="w-full py-2.5 bg-neutral-900 text-white font-bold rounded-2xl text-xs">
                    Continuar
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
