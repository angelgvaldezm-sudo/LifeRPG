    const roundToNearest10 = (num) => Math.round(num / 10) * 10;

    const thresholdForLevel = (level) => {
      if (level <= 1) return 0;
      return roundToNearest10(205 * Math.pow(level - 1, 1.77));
    };

    const calculateLevelState = (lifetimeXP) => {
      let level = 1;
      while (thresholdForLevel(level + 1) <= lifetimeXP) {
        level++;
      }
      const currentThreshold = thresholdForLevel(level);
      const nextThreshold = thresholdForLevel(level + 1);
      const xpIntoCurrentLevel = lifetimeXP - currentThreshold;
      const xpNeededForNextLevel = nextThreshold - currentThreshold;
      const progress = Math.min(Math.max(xpIntoCurrentLevel / (xpNeededForNextLevel || 1), 0), 1);

      return { level, xpIntoCurrentLevel, xpNeededForNextLevel, progress, lifetimeXP };
    };

    function pcmToWav(pcm16, sampleRate) {
      const buffer = new ArrayBuffer(44 + pcm16.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + pcm16.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, pcm16.length * 2, true);
      for (let i = 0; i < pcm16.length; i++) {
        view.setInt16(44 + i * 2, pcm16[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    const getRecentWeekDays = () => {
      const days = [];
      const today = new Date();
      for (let i = -3; i <= 3; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = d.toLocaleDateString('es-ES', { weekday: 'short' });
        const dayNum = d.getDate();
        days.push({
          dateStr,
          dayName: dayName.charAt(0).toUpperCase() + dayName.slice(1, 3),
          dayNum: dayNum.toString(),
          isToday: i === 0
        });
      }
      return days;
    };

                    <div className="grid grid-cols-3 gap-2">
                      {data.achievements.map((ach) => (
                        <div key={ach.id} className={`p-2.5 rounded-2xl border text-center space-y-1 transition-all ${ach.unlocked ? 'bg-orange-50 border-orange-200 text-neutral-900 shadow-sm' : 'bg-neutral-50 border-neutral-200 opacity-40'}`}>
                          <div className="text-2xl">{ach.icon}</div><div className="text-[10px] font-extrabold truncate">{ach.title}</div><div className="text-[8px] text-neutral-500 leading-tight">{ach.desc}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="p-4 rounded-3xl bg-white border border-neutral-200/80 shadow-sm space-y-2">
                    <h3 className="text-xs font-extrabold uppercase tracking-wider text-neutral-400">Progreso</h3>
                    <button onClick={handleResetProgressToZero} className="w-full py-3 bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 font-bold rounded-2xl text-xs flex items-center justify-center gap-2"><RotateCcw className="w-3.5 h-3.5" /> Reiniciar Progreso a Nivel 1 (0 XP)</button>
                  </div>
                </div>
              )}
            </main>

            {/* Bottom Dock Navigation */}
            <div className="absolute bottom-4 left-0 right-0 px-6 z-30 pointer-events-none">
              <nav className="pointer-events-auto bg-neutral-900 text-white rounded-full p-2 shadow-2xl flex items-center justify-around border border-neutral-800">
                {[{ id: 'today', label: 'Hoy', icon: CheckCircle2 }, { id: 'quests', label: 'Misiones', icon: Compass }, { id: 'boss', label: 'Jefe', icon: Crosshair }, { id: 'journey', label: 'Galería', icon: History }, { id: 'profile', label: 'Perfil', icon: User }].map((tab) => {
                  const Icon = tab.icon;
                  const isActive = activeTab === tab.id;
                  return (
                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-bold transition-all ${isActive ? 'bg-white text-neutral-900 shadow-md' : 'text-neutral-400 hover:text-white'}`}>
                      <Icon className="w-4 h-4" />{isActive && <span>{tab.label}</span>}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* MODAL: PROOF VERIFICATION */}
            {activeModal === 'proof' && selectedHabitForProof && (
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-white rounded-3xl border border-neutral-200 p-5 space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between"><h3 className="text-sm font-bold text-neutral-900 flex items-center gap-1.5"><Camera className="w-4 h-4 text-[#f94a29]" />Capturar Prueba de Hábito</h3><button onClick={() => setActiveModal(null)} className="text-neutral-400 hover:text-black"><X className="w-4 h-4" /></button></div>
                  <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={(e) => handleImageFileSelect(e, false)} className="hidden" />
                  <input ref={galleryInputRef} type="file" accept="image/*" onChange={(e) => handleImageFileSelect(e, false)} className="hidden" />
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => cameraInputRef.current && cameraInputRef.current.click()} className="py-3 bg-neutral-100 hover:bg-neutral-200 text-neutral-900 font-bold text-xs rounded-2xl flex items-center justify-center gap-1.5 border border-neutral-200"><Camera className="w-4 h-4 text-[#f94a29]" />Tomar Foto</button>
                    <button onClick={() => galleryInputRef.current && galleryInputRef.current.click()} className="py-3 bg-neutral-100 hover:bg-neutral-200 text-neutral-900 font-bold text-xs rounded-2xl flex items-center justify-center gap-1.5 border border-neutral-200"><ImageIcon className="w-4 h-4 text-[#f94a29]" />Elegir Galería</button>
                  </div>
                  {capturedImagePreview ? <div className="w-full h-44 rounded-2xl overflow-hidden border border-neutral-300 relative shadow-inner"><img src={capturedImagePreview} alt="Preview" className="w-full h-full object-cover" /><span className="absolute bottom-2 left-2 bg-neutral-900 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">Imagen lista para Gemini Vision</span></div> : <div className="w-full h-28 rounded-2xl border-2 border-dashed border-neutral-200 flex flex-col items-center justify-center text-neutral-400 text-xs"><p>Toma o selecciona una foto de tu hábito.</p></div>}
                  <input type="text" placeholder="Añadir nota opcional..." value={proofNote} onChange={(e) => setProofNote(e.target.value)} className="w-full bg-neutral-50 border border-neutral-200 rounded-2xl px-3 py-2 text-xs text-neutral-900 focus:outline-none" />
                  <button disabled={aiLoading} onClick={handleVerifyHabit} className="w-full py-3.5 bg-neutral-900 hover:bg-black text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-2 shadow-lg">{aiLoading ? <Loader2 className="w-4 h-4 animate-spin" /> : <Sparkles className="w-4 h-4 text-[#f94a29]" />}<span>Analizar con Gemini Vision & Ganar XP</span></button>
                </div>
              </div>
            )}

            {/* MODAL: SHOP */}
            {activeModal === 'shop' && (
              <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="w-full max-w-sm max-h-[85vh] bg-white rounded-3xl border border-neutral-200 p-5 space-y-4 flex flex-col shadow-2xl">
                  <div className="flex items-center justify-between"><h3 className="text-sm font-bold text-neutral-900 flex items-center gap-1.5"><ShoppingBag className="w-4 h-4 text-[#f94a29]" />Tienda de Recompensas</h3><div className="flex items-center gap-2"><span className="text-xs font-bold text-neutral-900 flex items-center gap-1"><Coins className="w-3.5 h-3.5 fill-amber-500 text-amber-500" /> {coinBalance}</span><button onClick={() => setActiveModal(null)} className="text-neutral-400 hover:text-black"><X className="w-4 h-4" /></button></div></div>
                  <div className="flex items-center justify-between"><span className="text-[10px] font-extrabold uppercase text-neutral-400">Objetos & Premios</span><button onClick={() => { setEditingReward(null); setRewardForm({ name: '', icon: '🎁', cost: 100, desc: 'Premio personalizado' }); setActiveModal('addReward'); }} className="text-xs font-bold text-[#f94a29] hover:underline flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> + Crear Premio</button></div>
                  <div className="overflow-y-auto space-y-2.5 pr-1 scrollbar-none flex-1">
                    {data.shopItems.map((item) => (
                      <div key={item.id} className="p-3 bg-neutral-50 rounded-2xl border border-neutral-200/80 flex items-center justify-between">
                        <div className="flex items-center space-x-2.5"><div className="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-xl border border-neutral-200 shadow-sm">{item.icon}</div><div><h4 className="text-xs font-bold text-neutral-900">{item.name}</h4><p className="text-[10px] text-neutral-500">{item.desc}</p></div></div>
                        <div className="flex items-center gap-1"><button onClick={() => handleBuyShopItem(item)} className="px-3 py-1.5 bg-neutral-900 hover:bg-black text-white font-bold text-xs rounded-full flex items-center gap-1 shadow-sm"><Coins className="w-3 h-3 fill-amber-400 text-amber-400" /><span>{item.cost}</span></button></div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* REWARD POPUP */}
            {rewardModal && (
              <div className="absolute inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-5">
                <div className="w-full max-w-xs bg-white rounded-3xl border border-neutral-200 p-6 text-center space-y-3 shadow-2xl">
                  <div className="text-3xl">{rewardModal.error ? '⚠️' : '🎉'}</div>
                  <h3 className={`text-base font-black ${rewardModal.error ? 'text-red-600' : 'text-neutral-900'}`}>{rewardModal.title}</h3>
                  <p className="text-xs text-neutral-600">{rewardModal.subtitle}</p>
                  {rewardModal.xp && <div className="text-xs font-bold text-[#f94a29]">+{rewardModal.xp} XP • +{rewardModal.coins} Monedas</div>}
                  <button onClick={() => setRewardModal(null)} className="w-full py-2.5 bg-neutral-900 text-white font-bold rounded-2xl text-xs shadow-md">Continuar</button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
